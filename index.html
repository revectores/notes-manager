<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记知识库</title>
  <style>
    /* The same palette and serif column as paper-notes (8035) and as the notes
       this page opens — see assets/style.css, which carries the note-side copy.
       The two-pane shape stays: a classification tree is what this app browses
       by, and paper-notes has nothing to browse by. */
    :root{
      --bg:#faf9f7; --fg:#1a1a1a; --muted:#888; --accent:#3a5f8a;
      --border:#e0ddd8; --card-bg:#ffffff; --header-bg:#f5f3ef;
      --chip-bg:#eeeae4; --danger:#c0392b;
      --mark:rgba(184,134,11,.3);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Georgia','Noto Serif SC',serif;
      font-size:15px;line-height:1.7;
      background:var(--bg);color:var(--fg);
      display:flex;height:100vh;overflow:hidden;
    }

    /* ── Left directory tree ── */
    #tree-panel{
      width:17rem;min-width:17rem;
      border-right:1px solid var(--border);
      display:flex;flex-direction:column;
      overflow:hidden;
    }
    #tree-header{
      padding:1.5rem 1rem .8rem;
      flex-shrink:0;
    }
    #tree-header-label{
      font-size:.68rem;font-weight:700;color:var(--muted);
      text-transform:uppercase;letter-spacing:.08em;
      margin-bottom:.6rem;
    }
    #tree-filter{
      width:100%;font:inherit;font-size:.8rem;
      padding:.35rem .6rem;
      color:var(--fg);background:var(--card-bg);
      border:1px solid var(--border);border-radius:6px;
    }
    #tree-filter:focus{outline:none;border-color:var(--accent)}
    #tree-filter::placeholder{color:var(--muted);opacity:.7}
    #tree-scroll{flex:1;overflow-y:auto;padding:0 .5rem 1.5rem}
    .tree-node{user-select:none}
    .tree-row{
      display:flex;align-items:center;gap:.2rem;
      padding:.12rem .4rem;cursor:pointer;
      border-radius:4px;white-space:nowrap;overflow:hidden;
    }
    .tree-row:hover{background:var(--card-bg)}
    .tree-row.selected{background:var(--accent);color:#fff}
    .tree-row.selected .tree-name,
    .tree-row.selected .tree-count,
    .tree-row.selected .tree-toggle{color:#fff}
    .tree-toggle{
      width:.9rem;flex-shrink:0;font-size:.6rem;color:var(--muted);
      text-align:center;cursor:pointer;
    }
    .tree-toggle:hover{color:var(--fg)}
    .tree-name{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:.8rem}
    .tree-count{
      font-size:.68rem;color:var(--muted);flex-shrink:0;
      font-variant-numeric:tabular-nums;
    }
    .tree-children{display:none}
    .tree-children.open{display:block}

    /* ── Right main panel ── */
    #main-panel{
      flex:1;display:flex;flex-direction:column;overflow:hidden;
      padding:1.5rem 2rem 0;
    }
    #main-top{
      display:flex;align-items:baseline;gap:1rem;
      padding-bottom:1rem;margin-bottom:1rem;
      border-bottom:1px solid var(--border);
      flex-shrink:0;
    }
    h1{
      font-size:1.15rem;font-weight:400;letter-spacing:.08em;
      color:var(--muted);white-space:nowrap;
    }
    #reload-btn{
      font:inherit;font-size:.78rem;color:var(--muted);
      background:var(--card-bg);border:1px solid var(--border);
      border-radius:6px;padding:.15rem .6rem;cursor:pointer;
    }
    #reload-btn:hover{color:var(--accent);border-color:var(--accent)}
    #search-input{
      width:100%;font:inherit;font-size:.9rem;
      padding:.55rem .8rem;
      color:var(--fg);background:var(--card-bg);
      border:1px solid var(--border);border-radius:6px;
      flex-shrink:0;
    }
    #search-input:focus{outline:none;border-color:var(--accent)}
    #status{font-size:.76rem;color:var(--muted);margin:.7rem 0 .3rem;
      flex-shrink:0;min-height:1em}
    #results{list-style:none;flex:1;overflow-y:auto;padding-bottom:2rem}

    /* One line per note, the way paper-notes lists one line per paper: the
       title is the link, everything under it is context. */
    #results li{
      padding:.6rem .5rem;
      border-bottom:1px solid var(--border);
      position:relative;
    }
    #results li:hover{background:var(--card-bg)}
    #results a{
      font-size:.95rem;font-weight:700;line-height:1.4;
      color:var(--fg);text-decoration:none;
    }
    #results li:hover > a{color:var(--accent)}
    .crumb{font-size:.72rem;color:var(--muted);margin:.15rem 0 .2rem}
    .crumb-link{cursor:pointer}
    .crumb-link:hover{color:var(--accent);text-decoration:underline}
    .snippet{font-size:.82rem;color:var(--muted);line-height:1.6}
    .lang-links{display:inline-flex;gap:.3rem;margin-left:.4rem;
      vertical-align:middle}
    .lang-link{
      font-size:.68rem;font-weight:400;color:var(--muted);
      background:var(--chip-bg);border-radius:999px;
      padding:.05rem .55rem;text-decoration:none;white-space:nowrap;
    }
    .lang-link:hover{color:var(--accent)}
    mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

    .row-actions{
      position:absolute;top:.6rem;right:.5rem;
      display:flex;gap:.25rem;opacity:0;transition:opacity .1s;
    }
    #results li:hover .row-actions{opacity:1}
    /* An armed or failed button stays visible even once the pointer leaves,
       otherwise the row it belongs to would silently forget its own state. */
    .row-actions:has(.del-btn.armed,.del-btn.failed){opacity:1}
    .del-btn{
      font:inherit;font-size:.8rem;color:var(--muted);
      background:none;border:none;padding:0 .2rem;line-height:1.2;
      cursor:pointer;
    }
    .del-btn:hover{color:var(--danger)}
    .del-btn.armed{
      font-size:.72rem;font-weight:700;color:#fff;
      background:var(--danger);border-radius:6px;padding:.1rem .5rem;
    }
    .del-btn.failed{
      font-size:.72rem;color:var(--danger);background:var(--chip-bg);
      border-radius:6px;padding:.1rem .5rem;cursor:default;
    }

    @media(max-width:900px){
      #tree-panel{display:none}
      #main-panel{padding:1.5rem 1rem 0}
    }
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#17161a; --fg:#e8e5df; --muted:#888; --accent:#7cafd6;
        --border:#2e2c30; --card-bg:#1e1c21; --header-bg:#27242c;
        --chip-bg:#2c2930; --danger:#d9705f;
        --mark:rgba(184,134,11,.42);
      }
      .tree-row.selected{color:#17161a}
      .tree-row.selected .tree-name,
      .tree-row.selected .tree-count,
      .tree-row.selected .tree-toggle{color:#17161a}
      .del-btn.armed{color:#17161a}
    }
  </style>
</head>
<body>

<aside id="tree-panel">
  <div id="tree-header">
    <div id="tree-header-label">目录</div>
    <input id="tree-filter" type="text" placeholder="筛选分类…" autocomplete="off" spellcheck="false">
  </div>
  <div id="tree-scroll">
    <div id="tree-container"></div>
  </div>
</aside>

<div id="main-panel">
  <div id="main-top">
    <h1>笔记知识库</h1>
    <button id="reload-btn" title="重新加载索引">↻ 重载</button>
  </div>
  <input id="search-input" type="text" placeholder="搜索笔记…" autofocus autocomplete="off" spellcheck="false">
  <div id="status"></div>
  <ul id="results"></ul>
</div>

<script>
const input     = document.getElementById('search-input');
const status    = document.getElementById('status');
const results   = document.getElementById('results');
const reloadBtn = document.getElementById('reload-btn');
const treeContainer = document.getElementById('tree-container');

let timer, totalCount = 0, selectedCls = '', selectedRow = null, armedDelete = null;
const rowByPath = {};

// ── Initialization ────────────────────────────────────────────────────────────────────

Promise.all([
  fetch('/api/search').then(r => r.json()),
  fetch('/api/tree').then(r => r.json()),
]).then(([search, tree]) => {
  totalCount = search.count;
  status.textContent = search.count + ' 篇笔记';
  renderTree(tree, treeContainer, 0);
}).catch(() => {
  status.textContent = '加载失败';
  treeContainer.textContent = '加载失败';
});

// ── Reload ──────────────────────────────────────────────────────────────────────

reloadBtn.addEventListener('click', () => {
  reloadBtn.textContent = '↻ …';
  fetch('/api/reload').then(r => r.json()).then(d => {
    totalCount = d.count;
    status.textContent = d.count + ' 篇笔记（已重载）';
    reloadBtn.textContent = '↻ 重载';
    return fetch('/api/tree').then(r => r.json());
  }).then(tree => {
    treeContainer.innerHTML = '';
    for (const k in rowByPath) delete rowByPath[k];
    renderTree(tree, treeContainer, 0);
  });
});

// ── Directory tree rendering ────────────────────────────────────────────────────────────────

function renderTree(node, container, depth) {
  // Special handling for the root node: display it as "全部笔记"
  if (depth === 0) {
    const allRow = makeRow('全部笔记', '', node.count, container, depth);
    allRow.classList.add('selected');
    selectedRow = allRow;
  }

  (node.children || []).forEach(child => {
    const nodeEl = document.createElement('div');
    nodeEl.className = 'tree-node';
    container.appendChild(nodeEl);

    const hasChildren = child.children && child.children.length > 0;
    const row = makeRow(child.name, child.path, child.count, nodeEl, depth + 1);

    if (hasChildren) {
      const childrenEl = document.createElement('div');
      childrenEl.className = 'tree-children';
      nodeEl.appendChild(childrenEl);

      const toggle = row.querySelector('.tree-toggle');
      toggle.textContent = '▸';
      toggle.addEventListener('click', e => {
        e.stopPropagation();
        const open = childrenEl.classList.toggle('open');
        toggle.textContent = open ? '▾' : '▸';
      });

      renderTree(child, childrenEl, depth + 1);
    }
  });
}

function makeRow(name, path, count, container, depth) {
  const row = document.createElement('div');
  row.className = 'tree-row';
  row.style.paddingLeft = (8 + depth * 12) + 'px';

  const hasChildren = false; // toggle added separately if needed

  const toggle = document.createElement('span');
  toggle.className = 'tree-toggle';
  toggle.textContent = ''; // filled in if has children

  const nameEl = document.createElement('span');
  nameEl.className = 'tree-name';
  nameEl.textContent = name;
  nameEl.title = name;

  const countEl = document.createElement('span');
  countEl.className = 'tree-count';
  countEl.textContent = count;

  row.appendChild(toggle);
  row.appendChild(nameEl);
  row.appendChild(countEl);
  container.appendChild(row);

  if (path) rowByPath[path] = row;

  row.addEventListener('click', () => {
    if (selectedRow) selectedRow.classList.remove('selected');
    row.classList.add('selected');
    selectedRow = row;
    selectedCls = path;
    doSearch();
  });

  return row;
}

function expandToRow(row) {
  let node = row.parentElement; // .tree-node
  while (node) {
    const parent = node.parentElement;
    if (parent && parent.classList.contains('tree-children')) {
      parent.classList.add('open');
      const parentNode = parent.parentElement; // .tree-node
      if (parentNode) {
        const toggle = parentNode.querySelector(':scope > .tree-row .tree-toggle');
        if (toggle && toggle.textContent) toggle.textContent = '▾';
      }
      node = parentNode;
    } else {
      break;
    }
  }
}

function selectByPath(path) {
  const row = rowByPath[path];
  if (!row) return;
  if (selectedRow) selectedRow.classList.remove('selected');
  row.classList.add('selected');
  selectedRow = row;
  selectedCls = path;
  expandToRow(row);
  row.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  doSearch();
}

// ── Directory tree filter ────────────────────────────────────────────────────────────────

const treeFilter = document.getElementById('tree-filter');
treeFilter.addEventListener('input', () => {
  const q = treeFilter.value.trim().toLowerCase();
  filterTree(treeContainer, q);
});

function filterTree(container, q) {
  if (!q) {
    // Clear the filter: restore the original state
    container.querySelectorAll('.tree-node').forEach(node => {
      node.style.display = '';
    });
    container.querySelectorAll('.tree-children').forEach(el => {
      el.classList.remove('open');
    });
    container.querySelectorAll('.tree-toggle').forEach(el => {
      if (el.textContent) el.textContent = '▸';
    });
    return;
  }

  // For each tree-node: show it if its own name or any descendant name matches, and expand to the matching node
  function processNode(nodeEl) {
    const row = nodeEl.querySelector(':scope > .tree-row');
    if (!row) return false;
    const nameEl = row.querySelector('.tree-name');
    const selfMatch = nameEl && nameEl.textContent.toLowerCase().includes(q);

    const childrenEl = nodeEl.querySelector(':scope > .tree-children');
    let childMatch = false;
    if (childrenEl) {
      childrenEl.querySelectorAll(':scope > .tree-node').forEach(child => {
        if (processNode(child)) childMatch = true;
      });
    }

    const visible = selfMatch || childMatch;
    nodeEl.style.display = visible ? '' : 'none';

    if (visible && childrenEl) {
      childrenEl.classList.add('open');
      const toggle = row.querySelector('.tree-toggle');
      if (toggle && toggle.textContent) toggle.textContent = '▾';
    }
    return visible;
  }

  // Only process tree-nodes directly under the root (the "全部笔记" row is not a tree-node)
  container.querySelectorAll(':scope > .tree-node').forEach(processNode);
}

// ── Search ──────────────────────────────────────────────────────────────────────

input.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(doSearch, 90);
});

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, tokens) {
  if (!tokens.length) return esc(text);
  const pats = tokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  return esc(text).replace(new RegExp('('+pats.join('|')+')', 'gi'), '<mark>$1</mark>');
}

// ── Delete confirmation ─────────────────────────────────────────────────────────

function disarmDelete() {
  if (!armedDelete) return;
  armedDelete.classList.remove('armed');
  armedDelete.textContent = '✕';
  armedDelete.title = '删除笔记';
  armedDelete = null;
}

// Anything else you do — a click elsewhere, Esc, typing a new query — means you
// did not mean to delete.
document.addEventListener('click', disarmDelete);
document.addEventListener('keydown', e => { if (e.key === 'Escape') disarmDelete(); });

const RESULT_LIMIT = 10000;

async function doSearch() {
  // The armed button is about to be replaced along with the rest of the list.
  armedDelete = null;
  const q = input.value.trim();
  let url = '/api/search?limit=' + RESULT_LIMIT;
  if (q) url += '&q=' + encodeURIComponent(q);
  if (selectedCls) url += '&cls=' + encodeURIComponent(selectedCls);

  const data = await fetch(url).then(r => r.json());
  const tokens = q ? (q.toLowerCase().match(/[\w一-鿿぀-ヿ＀-￯]+/g) || []) : [];

  if (data.total === 0) {
    status.textContent = q ? '无结果' : '此分类下无笔记';
    results.innerHTML = '';
    return;
  }

  const label = selectedCls
    ? `${data.total} 篇` + (q ? ` · 搜索"${q}"` : '')
    : (q ? `${data.total} 条结果` : `${data.count} 篇笔记`);
  status.textContent = label + (data.total > RESULT_LIMIT ? `（显示前 ${RESULT_LIMIT} 条）` : '');

  results.innerHTML = data.results.map(e => {
    const langLinks = e.langs
      ? Object.entries(e.langs)
          .filter(([, p]) => p !== e.path)
          .map(([l, p]) => `<a class="lang-link" href="${p}">${esc(l)}</a>`)
          .join('')
      : '';
    return `
    <li data-path="${e.path}">
      <a href="${e.path}" target="_blank">${highlight(e.title, tokens)}</a>
      ${langLinks ? `<span class="lang-links">${langLinks}</span>` : ''}
      <span class="row-actions">
        <button class="del-btn" title="删除笔记">✕</button>
      </span>
      ${e.crumb.length ? `<div class="crumb">${e.crumb.map((seg, i) =>
        `<span class="crumb-link" data-cls="${esc(e.crumb.slice(0,i+1).join('/'))}">${esc(seg)}</span>`
      ).join(' / ')}</div>` : ''}
      ${e.snippet ? `<div class="snippet">${highlight(e.snippet, tokens)}</div>` : ''}
    </li>`;
  }).join('');

  results.querySelectorAll('.crumb-link').forEach(span => {
    span.addEventListener('click', () => selectByPath(span.dataset.cls));
  });

  results.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.preventDefault();
      // Keep the click off the document listener below, which disarms.
      e.stopPropagation();
      if (btn.classList.contains('failed')) return;

      // First click arms the button, second one deletes. Confirming in the row
      // itself rather than in a confirm() keeps the note's title and category
      // on screen while you decide, which a modal covers up.
      if (armedDelete !== btn) {
        disarmDelete();
        armedDelete = btn;
        btn.classList.add('armed');
        btn.textContent = '删除？';
        btn.title = '再次点击删除，按 Esc 取消';
        return;
      }
      disarmDelete();

      const li = btn.closest('li');
      const filename = li.dataset.path.split('/').pop();
      let data;
      try {
        const res = await fetch(`/api/notes/${encodeURIComponent(filename)}`, {method: 'DELETE'});
        data = await res.json();
      } catch (err) {
        data = {ok: false, error: String(err)};
      }
      if (!data.ok) {
        btn.classList.add('failed');
        btn.textContent = '删除失败';
        btn.title = data.error || '未知错误';
        return;
      }
      li.remove();
      totalCount = data.count;
      status.textContent = status.textContent.replace(/\d+ 篇笔记/, data.count + ' 篇笔记');
      // Refresh tree counts
      fetch('/api/tree').then(r => r.json()).then(tree => {
        treeContainer.innerHTML = '';
        renderTree(tree, treeContainer, 0);
      });
    });
  });
}
</script>
</body>
</html>
